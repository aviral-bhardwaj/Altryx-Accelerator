listing:
  title: Alteryx to Databricks Accelerator (Skill Mode)
  subtitle: Convert Alteryx .yxmd workflows into validated, production-ready PySpark
    notebooks — with a self-correcting validation loop and Asset Bundle deploy.
  listing_type:
  - notebooks
  - files
  provider_name: Vrahad Analytics
  categories:
  - Data Engineering
  - Migrations
