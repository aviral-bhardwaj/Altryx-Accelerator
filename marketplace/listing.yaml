  industries:
  - Cross-Industry
  description: Convert Alteryx .yxmd workflows to PySpark notebooks using a deterministic
    converter and structural validation. Includes four self-contained notebooks, a
    Python wheel, four sample workflows, and synthetic Spark validation. Map external
    sources to Unity Catalog tables before executing. Review WARNING reports and partial
    tools; structural PASS is not a guarantee of data parity. Install the shared Volume,
    import notebook 02, set wheel_path and samples_dir, and Run All. No Git checkout
    is required. Requires UC and Databricks Runtime 13.3 LTS or newer.
